name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew --no-daemon :core:test

      - name: APK 빌드
        run: ./gradlew --no-daemon assembleRelease

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk OmokHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmokHelper-apk
          path: OmokHelper.apk

      - name: latest 태그 옮기기
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git tag -f latest
          git push -f origin latest

      - name: latest 릴리스에 올리기
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 오목 헬퍼 (최신 빌드)
          body: |
            `OmokHelper.apk` 를 휴대폰에서 받아 설치하세요.
            커밋: ${{ github.sha }}
          files: OmokHelper.apk
          make_latest: true
